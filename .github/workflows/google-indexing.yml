name: Submit Sitemap URLs to Google Indexing API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  index-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Google Indexing Submission
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: node scripts/submit-indexing.js
